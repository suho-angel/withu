name: CI

permissions:
  contents: read
  packages: write

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root_pass
          MYSQL_DATABASE: withu
          MYSQL_USER: withu
          MYSQL_PASSWORD: withu_pass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -proot_pass" --health-interval=10s --health-timeout=5s --health-retries=5
    env:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DB: withu
      MYSQL_USER: withu
      MYSQL_PASSWORD: withu_pass
      FLASK_ENV: development
      FLASK_DEBUG: 0
      PYTHONUNBUFFERED: 1
      # Secrets (define in repo settings → Actions → Secrets):
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      SMTP_HOST: smtp.gmail.com
      SMTP_PORT: 587
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      SMTP_USE_TLS: 1
      MAIL_FROM: ${{ secrets.SMTP_USER }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Wait for MySQL
        run: |
          for i in {1..20}; do
            if mysql -h mysql -uwithu -pwithu_pass -e 'SELECT 1;' >/dev/null 2>&1; then echo 'MySQL up'; break; fi
            echo 'Waiting MySQL...'; sleep 3;
          done

      - name: Initialize & Smoke Test
        run: |
          python run.py &
          APP_PID=$!
          # Wait for Flask port
          for i in {1..30}; do
            if curl -s http://localhost:5000/health | grep -q '"status":'; then echo 'Health OK'; break; fi
            echo 'Waiting app...'; sleep 2;
          done
          curl -s http://localhost:5000/health
          kill $APP_PID || true

      - name: Docker Build
        run: |
          docker build -t withu:ci .

      - name: Summary
        run: |
          echo 'CI pipeline completed successfully.'

  docker-image:
    if: github.ref == 'refs/heads/main'
    needs: build-and-test
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: withu
      REGISTRY: ghcr.io/suho-angel
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/suho-angel/withu:latest
            ghcr.io/suho-angel/withu:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Output image tags
        run: |
          echo "Published: ghcr.io/suho-angel/withu:latest"
          echo "Published: ghcr.io/suho-angel/withu:${GITHUB_SHA}"
